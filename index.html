<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jungle Rush 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#10291a;font-family:Arial,sans-serif;touch-action:manipulation}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:white;font-weight:bold;font-size:18px;z-index:2}
.pill{background:#10291add;padding:10px 14px;border-radius:12px}
#menu{position:fixed;inset:0;background:#07170dcc;display:flex;align-items:center;justify-content:center;text-align:center;color:white;z-index:5;padding:20px}
#panel{background:#163c27;padding:28px 22px;border-radius:22px;max-width:340px;width:100%;border:1px solid #8abf8c}
h1{font-size:32px;margin:0 0 12px}
p{line-height:1.5}
button{border:0;border-radius:12px;padding:14px 18px;background:#ffd447;color:#1b2915;font-size:17px;font-weight:bold}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;z-index:3}
.group{display:flex;gap:10px}
.ctrl{width:58px;height:55px;padding:0;background:#10291add;color:white;border:1px solid #ffffff66;font-size:24px}
</style>
</head>
<body>
<div id="hud">
  <div class="pill">🪙 <span id="score">0</span></div>
  <div class="pill">🏃 <span id="dist">0</span> m</div>
</div>

<div id="controls">
  <div class="group">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="group">
    <button class="ctrl" id="jump">⬆</button>
    <button class="ctrl" id="slide">⬇</button>
  </div>
</div>

<div id="menu">
  <div id="panel">
    <h1>🌴 JUNGLE RUSH 3D</h1>
    <p>Run through the ancient jungle! Collect coins and dodge obstacles.</p>
    <button id="start">START RUN ▶</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const menu=document.getElementById('menu');
const panel=document.getElementById('panel');

if(!window.THREE){
  panel.innerHTML='<h1>Loading error</h1><p>Connect to the internet and reload the page.</p><button onclick="location.reload()">RELOAD</button>';
  return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91bd86);
scene.fog=new THREE.Fog(0x91bd86,25,100);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);
camera.position.set(0,5,9);
camera.lookAt(0,1,-5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.insertBefore(renderer.domElement,document.getElementById('hud'));

scene.add(new THREE.HemisphereLight(0xffffff,0x334422,2));
const light=new THREE.DirectionalLight(0xffedbb,2.5);
light.position.set(-5,12,6);
light.castShadow=true;
scene.add(light);

function material(color){
  return new THREE.MeshStandardMaterial({color,roughness:.85});
}
const green=material(0x315c2b);
const roadMat=material(0x89785c);
const stone=material(0x77796b);
const gold=material(0xffc928);
const brown=material(0x65452b);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),green);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.15,-50);
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(8,180),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.08,-60);
scene.add(road);

for(let z=5;z>-145;z-=8){
  for(const x of [-1.3,1.3]){
    const line=new THREE.Mesh(
      new THREE.BoxGeometry(.05,.02,2),
      material(0xc1b18b)
    );
    line.position.set(x,.01,z);
    scene.add(line);
    marks.push(line);
  }
}
function tree(x,z){
  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.2,.3,2.6,7),brown
  );
  trunk.position.set(x,1.2,z);
  scene.add(trunk);
  const leaves=new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.15,1),green
  );
  leaves.position.set(x,2.7,z);
  scene.add(leaves);
}
const marks=[];
for(let z=8;z>-140;z-=8){
  tree(-6.5-Math.random()*1.5,z);
  tree(6.5+Math.random()*1.5,z-3);
}

function block(x,y,z,w,h,d,color){
  const o=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),material(color)
  );
  o.position.set(x,y,z);
  o.castShadow=true;
  scene.add(o);
  return o;
}

// Ancient temple gate
block(-3.8,2,-25,.8,4,.9,0x77796b);
block(3.8,2,-25,.8,4,.9,0x77796b);
block(0,4,-25,8,.6,1,0x4e5946);

// Runner character
const player=new THREE.Group();
scene.add(player);
blockPlayer();

function blockPlayer(){
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(.6,.8,.35),material(0x25805c)
  );
  body.position.y=1.05;
  player.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.25,12,10),material(0xd99c6b)
  );
  head.position.y=1.65;
  player.add(head);

  const hair=new THREE.Mesh(
    new THREE.SphereGeometry(.26,10,8),material(0x33251b)
  );
  hair.scale.y=.5;
  hair.position.y=1.82;
  player.add(hair);

  for(const s of [-1,1]){
    const leg=new THREE.Mesh(
      new THREE.BoxGeometry(.22,.6,.25),material(0x263c39)
    );
    leg.position.set(s*.17,.35,0);
    player.add(leg);
  }
}
player.position.set(0,0,2);

// Keep world objects
const obstacles=[];
const coins=[];
const marks=[];

function spawnObstacle(lane,z){
  const type=Math.random()<.5?'jump':'slide';
  const g=new THREE.Group();
  g.position.set(lane*2.5,0,z);

  if(type==='jump'){
    blockGroup(g,1.2,.7,.8,.35,0x65452b);
  }else{
    blockGroup(g,1.2,1.5,.7,1.4,0x77796b);
  }
  g.userData={lane,type};
  scene.add(g);
  obstacles.push(g);
}
function blockGroup(g,w,h,d,y,color){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),material(color)
  );
  m.position.y=y;
  m.castShadow=true;
  g.add(m);
}
function spawnCoin(lane,z){
  const c=new THREE.Mesh(
    new THREE.TorusGeometry(.27,.09,8,16),gold
  );
  c.position.set(lane*2.5,1.2,z);
  scene.add(c);
  coins.push(c);
}
function spawnSet(z){
  const lane=Math.floor(Math.random()*3)-1;
  spawnObstacle(lane,z);
  const cl=Math.floor(Math.random()*3)-1;
  for(let i=0;i<4;i++)spawnCoin(cl,z-3-i*1.8);
}

let running=false,lane=0,score=0,distance=0;
let jumpY=0,jumpV=0,sliding=0,elapsed=0,spawnTime=0;

function reset(){
  for(const o of obstacles)scene.remove(o);
  for(const c of coins)scene.remove(c);
  obstacles.length=0;
  coins.length=0;

  lane=0;score=0;distance=0;
  jumpY=0;jumpV=0;sliding=0;
  elapsed=0;spawnTime=0;
  player.position.set(0,0,2);
  player.scale.y=1;

  for(let z=-25;z>-110;z-=20)spawnSet(z);
  document.getElementById('score').textContent='0';
  document.getElementById('dist').textContent='0';
  running=true;
  menu.style.display='none';
}

function endGame(){
  running=false;
  panel.innerHTML='<h1>🏛️ GAME OVER</h1><p>Coins: '+score+
    '<br>Distance: '+Math.floor(distance)+
    ' m</p><button id="again">PLAY AGAIN ↻</button>';
  menu.style.display='flex';
  document.getElementById('again').onclick=reset;
}

function left(){if(running)lane=Math.max(-1,lane-1);}
function right(){if(running)lane=Math.min(1,lane+1);}
function jump(){if(running&&jumpY===0&&sliding<=0)jumpV=8;}
function slide(){if(running&&jumpY===0)sliding=.7;}

document.getElementById('left').onclick=left;
document.getElementById('right').onclick=right;
document.getElementById('jump').onclick=jump;
document.getElementById('slide').onclick=slide;
document.getElementById('start').onclick=reset;

let tx=0,ty=0;
window.addEventListener('touchstart',e=>{
  if(e.target.closest('button'))return;
  tx=e.changedTouches[0].clientX;
  ty=e.changedTouches[0].clientY;
},{passive:true});

window.addEventListener('touchend',e=>{
  if(e.target.closest('button'))return;
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
  if(Math.abs(dx)>Math.abs(dy))dx<0?left():right();
  else dy<0?jump():slide();
},{passive:true});

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')left();
  if(e.key==='ArrowRight')right();
  if(e.key==='ArrowUp'||e.key===' ')jump();
  if(e.key==='ArrowDown')slide();
});

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);

  if(running){
    elapsed+=dt;
    distance+=13*dt;
    document.getElementById('dist').textContent=Math.floor(distance);

    player.position.x+=(lane*2.5-player.position.x)*Math.min(1,dt*10);

    if(jumpV!==0||jumpY>0){
      jumpY+=jumpV*dt;
      jumpV-=20*dt;
      if(jumpY<=0){jumpY=0;jumpV=0;}
    }
    if(sliding>0)sliding-=dt;

    player.position.y=sliding>0?0:jumpY;
    player.scale.y=sliding>0?.65:1;

    camera.position.x+=(player.position.x*.2-camera.position.x)*dt*2;
    camera.lookAt(player.position.x*.15,1.2,-5);

    for(const m of marks){
      m.position.z+=13*dt;
      if(m.position.z>10)m.position.z-=153;
    }

    for(const o of obstacles){
      const oldZ=o.position.z;
      o.position.z+=13*dt;
      if(oldZ<=2.8&&o.position.z>2.8&&
        Math.abs(player.position.x-o.userData.lane*2.5)<1){
        const avoided=o.userData.type==='jump'?jumpY>.8:sliding>0;
        if(!avoided){endGame();break;}
      }
    }

    for(let i=obstacles.length-1;i>=0;i--){
      if(obstacles[i].position.z>12){
        scene.remove(obstacles[i]);obstacles.splice(i,1);
      }
    }

    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i];
      c.position.z+=13*dt;
      c.rotation.y+=dt*4;
      if(Math.abs(c.position.z-2)<.8&&
         Math.abs(c.position.x-player.position.x)<.9){
        score++;
        document.getElementById('score').textContent=score;
        scene.remove(c);coins.splice(i,1);
      }else if(c.position.z>12){
        scene.remove(c);coins.splice(i,1);
      }
    }

    spawnTime+=dt;
    if(spawnTime>2.2){
      spawnTime=0;
      spawnSet(-100);
    }
  }

  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
